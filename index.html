<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>BBS سريع</title>
<style>
:root{
  --bg:#f3f5f7; --card:#fff; --ink:#14202b; --mute:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand-ink:#fff; --warn:#b45309; --bad:#b91c1c; --ok:#15803d; --chip:#e6f4f1;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0e1419; --card:#18222b; --ink:#e8eef3; --mute:#93a4b4; --line:#2a3744; --brand:#2dd4bf; --brand-ink:#04211d; --warn:#fbbf24; --bad:#f87171; --ok:#4ade80; --chip:#143a36; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);padding:0 16px 120px;max-width:560px;margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
label.f:first-child{margin-top:0}
select,input[type=text],input[type=password],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);direction:ltr}
.stepper button{width:44px;height:42px;border:0;background:transparent;color:var(--ink);font-size:22px;cursor:pointer}
.stepper button:active{background:var(--line)}
.stepper span{min-width:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
details.grp{border-top:1px solid var(--line)}
details.grp:first-of-type{border-top:0}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 2px;display:flex;justify-content:space-between;align-items:center;font-weight:600;direction:ltr;text-align:left}
details.grp>summary::-webkit-details-marker{display:none}
.badge{background:var(--chip);color:var(--brand);border-radius:999px;font-size:12px;padding:2px 9px;min-width:26px;text-align:center}
.badge.zero{opacity:.35}
.item{padding:8px 2px 12px;border-top:1px dashed var(--line);direction:ltr;text-align:left}
.item:first-of-type{border-top:0}
.item .top{display:flex;gap:10px;align-items:center}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.item .id{color:var(--mute);font-size:13px;min-width:26px}
.item .ctl{margin:8px 0 0 32px;display:flex;flex-direction:column;gap:8px;direction:rtl;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:9px 16px;font:inherit;cursor:pointer}
.seg button.on.safe{background:var(--ok);color:#fff}
.seg button.on.unsafe{background:var(--bad);color:#fff}
.hint{font-size:12px;color:var(--mute)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:560px;margin-inline:auto}
.sum{font-size:13px;color:var(--mute);margin-bottom:8px;display:flex;justify-content:space-between}
.send{width:100%;border:0;border-radius:12px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:17px;padding:14px;cursor:pointer}
.send:disabled{opacity:.5}
.status{margin:10px 0 0;font-size:14px;border-radius:10px;padding:10px 12px;display:none}
.status.show{display:block}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.status.err{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.status a{color:inherit;font-weight:700}
.toggle{display:flex;align-items:center;gap:10px}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
.gear{background:none;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}
.small{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>BBS سريع</h1>
  <button class="gear" id="gear" type="button">إعدادات الربط</button>
</header>
<p class="sub">سجّل ما شاهدته فعلاً. الأداة تعبّي الموقع وتحفظ بدالك.</p>

<section class="card" id="cfg" hidden>
  <label class="f" for="repo">الريبو (اسم المستخدم/اسم الريبو)</label>
  <input type="text" id="repo" placeholder="username/bbs-tool" autocapitalize="off" autocorrect="off" dir="ltr">
  <label class="f" for="branch">الفرع</label>
  <input type="text" id="branch" value="main" autocapitalize="off" autocorrect="off" dir="ltr">
  <label class="f" for="token">التوكن (Fine-grained token)</label>
  <input type="password" id="token" placeholder="github_pat_..." autocomplete="off" dir="ltr">
  <p class="small">يتخزن في متصفح جوالك فقط، ولا يروح لأي مكان غير GitHub.</p>
  <button class="gear" id="saveCfg" type="button">حفظ</button>
</section>

<section class="card">
  <label class="f" for="area">المنطقة</label>
  <select id="area" dir="ltr"></select>
  <label class="f">عدد الأشخاص اللي راقبتهم</label>
  <div class="row"><span class="hint">كل بند بعدّاد يُحسب على هذا العدد</span><div id="people"></div></div>
  <label class="f">عدد اللي تكلمت معهم (فارغ = تلقائي)</label>
  <div class="row"><span class="hint" id="fbHint"></span><div id="fb"></div></div>
</section>

<section class="card" id="items"></section>

<section class="card">
  <label class="f" for="notes">ملاحظات (اختياري)</label>
  <textarea id="notes" dir="ltr" placeholder="Notes"></textarea>
  <div class="toggle" style="margin-top:12px">
    <input type="checkbox" id="dry">
    <label for="dry">تجربة: يعبّي الموقع بدون الحفظ النهائي</label>
  </div>
</section>

<div class="bar"><div class="in">
  <div class="sum"><span id="sumTxt"></span><span id="todayTxt"></span></div>
  <button class="send" id="send" type="button">رفع للموقع</button>
  <div class="status" id="status" role="status"></div>
</div></div>

<script>
/* ===== البنود: عدّل هنا لو أضفت بنود جديدة. type: count = عدّاد Safe/Unsafe, radio = اختيار Safe/Unsafe ===== */
const AREAS = ["Area 340","Area 350","Area 360","Area 370","Area 380","Area 422"];
const CATALOG = [
 {cat:"PPE Specific (unsafe also if in bad conditions)", items:[
  {id:9,  t:"Face mask", type:"count", p:"wore face masks where dust was present"},
  {id:10, t:"Specific gloves", type:"count", p:"wore the specific gloves for the task"},
  {id:11, t:"Ear protection", type:"count", p:"wore ear protection in the noisy area"},
  {id:12, t:"Face shield", type:"count", p:"wore face shields as required"}]},
 {cat:"Safe practices and conditions", items:[
  {id:13, t:"Pedestrian way", type:"count", p:"walked on the pedestrian path"},
  {id:14, t:"Eyes on the job", type:"count", p:"kept their eyes on the job and stayed aware of their surroundings"},
  {id:15, t:"Area cleaned and organized", type:"radio"},
  {id:16, t:"Valid PTW", type:"radio"},
  {id:17, t:"Tools color code", type:"radio"},
  {id:18, t:"Electrical cables condition", type:"radio"},
  {id:19, t:"Night shift illumination", type:"count", p:"worked in a properly illuminated area"}]},
 {cat:"Working at height", items:[
  {id:23, t:"Full body harness", type:"count", p:"wore the full body harness properly"},
  {id:24, t:"Anchorage point", type:"count", p:"were anchored at the designated anchorage point"},
  {id:25, t:"Safety net", type:"radio"},
  {id:26, t:"Ladders tagged and secured", type:"count", p:"used tagged and secured ladders"},
  {id:27, t:"Ladder three points of contact", type:"count", p:"used the ladder with three points of contact"},
  {id:28, t:"Tools lanyards", type:"count", p:"used tool lanyards"},
  {id:29, t:"Gratings and roofs secured", type:"count", p:"sat or stood only on secured gratings"},
  {id:30, t:"Access and egress tag", type:"radio"},
  {id:31, t:"Tools secured from fall", type:"radio"},
  {id:32, t:"Upper body within scaffold", type:"count", p:"kept their upper bodies within the scaffold"}]},
 {cat:"Hot works", items:[
  {id:61, t:"Fire watch", type:"radio"},
  {id:62, t:"Area free from flammables", type:"radio"},
  {id:63, t:"Hot work area secured", type:"radio"},
  {id:64, t:"Fire extinguisher", type:"radio"},
  {id:65, t:"Grinding piece secured", type:"radio"}]},
 {cat:"Piping", items:[
  {id:71, t:"Safe access during pipe installation", type:"count", p:"followed safe access during pipe installation"}]}
];

const $ = (s, r=document) => r.querySelector(s);
function h(tag, props={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const jset = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const S = Object.assign({area:"Area 360", people:4, dry:true, fb:null, sel:{}}, jget('bbs_state', {}));
const C = Object.assign({repo:"", branch:"main", token:""}, jget('bbs_cfg', {}));
const save = () => jset('bbs_state', {area:S.area, people:S.people, dry:S.dry, fb:S.fb, sel:S.sel});
const todayKey = () => new Date().toLocaleDateString('en-CA');
const sentToday = () => { const s = jget('bbs_sent', {}); return s.d === todayKey() ? s.n : 0; };

function stepper(get, min, max, set){
  const num = h('span', {}, String(get() ?? '—'));
  const mk = (txt, d) => h('button', {type:'button', onclick:()=>{
    const cur = get() ?? (d > 0 ? min - 1 : min);
    const nv = Math.max(min, Math.min(max, cur + d));
    set(nv); num.textContent = String(nv);
  }}, txt);
  const el = h('div', {class:'stepper'}, mk('−', -1), num, mk('+', +1));
  el.refresh = () => num.textContent = String(get() ?? '—');
  return el;
}

function autoText(it, safe, unsafe){
  const base = it.p ? `Workers ${it.p}.` : `Observed ${it.t}.`;
  if (unsafe === 0) return `${base} Positive feedback given.`;
  if (safe === 0) return `${unsafe} workers did not comply with ${it.t}. Corrected on the spot.`;
  return `${base} Positive feedback given to ${safe}, ${unsafe} corrected on the spot.`;
}

function computeFb(){
  let m = 0;
  for (const g of CATALOG) for (const it of g.items){
    if (it.type === 'count' && S.sel[it.id]) m = Math.max(m, S.people);
  }
  return m;
}

function buildPayload(){
  const N = S.people, items = [];
  for (const g of CATALOG) for (const it of g.items){
    const st = S.sel[it.id]; if (!st) continue;
    if (it.type === 'count'){
      const unsafe = Math.min(st.unsafe || 0, N), safe = N - unsafe;
      items.push({id:it.id, cat:g.cat, type:'count', safe, unsafe, pos:safe, corr:unsafe, text:(st.text && st.text.trim()) || autoText(it, safe, unsafe)});
    } else {
      items.push({id:it.id, cat:g.cat, type:'radio', value: st.value || 'safe'});
    }
  }
  return {dry_run:S.dry, area:S.area, people:N, feedbacked:(S.fb ?? computeFb()), notes:$('#notes').value.trim(), items};
}

function renderSummary(){
  const k = Object.keys(S.sel).length;
  $('#sumTxt').textContent = `${S.people} أشخاص · ${k} بند`;
  $('#todayTxt').textContent = `أُرسل اليوم: ${sentToday()}`;
  $('#fbHint').textContent = S.fb == null ? `تلقائي: ${computeFb()}` : 'يدوي';
}

function renderItems(){
  const root = $('#items'); root.replaceChildren();
  CATALOG.forEach((g, gi) => {
    const selCount = g.items.filter(it => S.sel[it.id]).length;
    const badge = h('span', {class:'badge' + (selCount ? '' : ' zero')}, String(selCount));
    const det = h('details', {class:'grp'}, h('summary', {}, h('span', {}, g.cat), badge));
    if (selCount) det.open = true;
    g.items.forEach(it => {
      const st = S.sel[it.id];
      const cb = h('input', {type:'checkbox', ...(st ? {checked:true} : {}), onchange:(e)=>{
        if (e.target.checked) S.sel[it.id] = it.type === 'count' ? {unsafe:0} : {value:'safe'};
        else delete S.sel[it.id];
        save(); renderItems(); renderSummary();
      }});
      const box = h('div', {class:'item'}, h('label', {class:'top'}, cb, h('span', {class:'id'}, String(it.id)), h('span', {}, it.t)));
      if (st){
        const ctl = h('div', {class:'ctl'});
        if (it.type === 'count'){
          const info = h('span', {class:'hint'});
          const upd = () => info.textContent = `آمن: ${S.people - Math.min(st.unsafe||0, S.people)} · غير آمن: ${Math.min(st.unsafe||0, S.people)}`;
          upd();
          const stp = stepper(()=>st.unsafe||0, 0, 30, v=>{ st.unsafe = v; save(); upd(); });
          const txt = h('input', {type:'text', dir:'ltr', placeholder:'نص الفيدباك (تلقائي إذا تركته فاضي)', value: st.text||'', oninput:(e)=>{ st.text = e.target.value; save(); }});
          ctl.append(h('div', {class:'row'}, h('span', {}, 'غير آمن'), stp), info, txt);
        } else {
          const mkb = (val, label) => h('button', {type:'button', class:`${val}${(st.value||'safe')===val?' on':''}`, onclick:()=>{ st.value = val; save(); renderItems(); }}, label);
          ctl.append(h('div', {class:'seg'}, mkb('safe','آمن'), mkb('unsafe','غير آمن')));
        }
        box.append(ctl);
      }
      det.append(box);
    });
    root.append(det);
  });
}

function status(kind, html){
  const s = $('#status'); s.className = 'status show ' + kind; s.innerHTML = html;
}

async function send(){
  const p = buildPayload();
  if (!C.repo || !C.token){ $('#cfg').hidden = false; return status('err', 'أكمل إعدادات الربط أولاً (الريبو والتوكن).'); }
  if (!p.items.length) return status('err', 'اختر بند واحد على الأقل.');
  if (p.people < 1) return status('err', 'عدد الأشخاص لازم يكون 1 أو أكثر.');
  if (!p.dry_run && sentToday() >= 2 && !confirm('أرسلت ملاحظتين اليوم. تبي ترسل مرة ثانية؟')) return;
  if (!p.dry_run && !confirm(`رفع نهائي للموقع؟\n${p.area} · ${p.people} أشخاص · ${p.items.length} بند`)) return;
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    const r = await fetch(`https://api.github.com/repos/${C.repo}/actions/workflows/submit.yml/dispatches`, {
      method:'POST',
      headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${C.token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
      body: JSON.stringify({ref: C.branch || 'main', inputs:{payload: JSON.stringify(p)}})
    });
    if (r.status === 204){
      if (!p.dry_run){ const s = jget('bbs_sent', {}); jset('bbs_sent', {d:todayKey(), n:(s.d===todayKey()?s.n:0)+1}); }
      status('ok', `تم الإرسال${p.dry_run ? ' (تجربة)' : ''}. التنفيذ ياخذ دقيقة تقريباً. <a href="https://github.com/${C.repo}/actions" target="_blank" rel="noopener">شوف النتيجة</a>`);
      renderSummary();
    } else {
      const msg = {401:'التوكن غلط أو منتهي.', 403:'التوكن ما عنده صلاحية Actions: Read and write.', 404:'الريبو أو ملف submit.yml غير موجود، أو التوكن ما يشمل هذا الريبو.', 422:'الفرع غلط (غالباً main) أو الملف ما فيه workflow_dispatch.'}[r.status] || `خطأ ${r.status}`;
      status('err', msg);
    }
  } catch (e){
    status('err', 'ما قدرت أوصل لـ GitHub. تأكد من الإنترنت.');
  } finally {
    btn.disabled = false; btn.textContent = 'رفع للموقع';
  }
}

/* ===== ربط الواجهة ===== */
AREAS.forEach(a => $('#area').append(h('option', {value:a, ...(a===S.area?{selected:true}:{})}, a)));
$('#area').addEventListener('change', e => { S.area = e.target.value; save(); });
$('#people').append(stepper(()=>S.people, 1, 30, v=>{ S.people = v; for (const id in S.sel){ if (S.sel[id].unsafe > v) S.sel[id].unsafe = v; } save(); renderItems(); renderSummary(); }));
const fbStep = stepper(()=>S.fb, 0, 30, v=>{ S.fb = v; save(); renderSummary(); });
const fbReset = h('button', {type:'button', class:'gear', onclick:()=>{ S.fb = null; save(); fbStep.refresh(); renderSummary(); }}, 'تلقائي');
$('#fb').append(h('div', {class:'row'}, fbReset, fbStep));
$('#dry').checked = S.dry;
$('#dry').addEventListener('change', e => { S.dry = e.target.checked; save(); });
$('#gear').addEventListener('click', () => { $('#cfg').hidden = !$('#cfg').hidden; });
$('#repo').value = C.repo; $('#branch').value = C.branch; $('#token').value = C.token;
$('#saveCfg').addEventListener('click', () => {
  C.repo = $('#repo').value.trim(); C.branch = $('#branch').value.trim() || 'main'; C.token = $('#token').value.trim();
  jset('bbs_cfg', C); $('#cfg').hidden = true; status('ok', 'تم حفظ الإعدادات.');
});
$('#send').addEventListener('click', send);
if (!C.repo || !C.token) $('#cfg').hidden = false;
renderItems(); renderSummary();
</script>
</body>
</html>
